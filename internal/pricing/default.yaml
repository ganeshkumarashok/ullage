# Built-in accelerator rates, in USD per device-hour.
#
# These are rough public on-demand list prices, and they are wrong for almost
# everyone: reservations, savings plans, spot and negotiated discounts all move
# them, often by more than half. They exist so the first run shows a number of
# the right order of magnitude rather than nothing at all.
#
# Replace them with your own:
#
#   ullage --pricing ./my-rates.yaml
#
# The source string below is printed under every cost in the output, so a reader
# always knows whether the money came from your finance team or from this file.
source: "built-in list prices (approximate; override with --pricing)"
currency: USD

perSKUGPUHour:
  NVIDIA-H100-SXM5-80GB: 5.50
  NVIDIA-H100-PCIE-80GB: 4.50
  NVIDIA-H200: 6.30
  NVIDIA-A100-SXM4-80GB: 3.40
  NVIDIA-A100-SXM4-40GB: 2.60
  NVIDIA-A100-PCIE-40GB: 2.40
  NVIDIA-L40S: 1.60
  NVIDIA-L4: 0.75
  NVIDIA-A10: 0.90
  NVIDIA-A10G: 0.90
  Tesla-T4: 0.35
  Tesla-V100-SXM2-16GB: 1.20
  NVIDIA-GB200: 9.00
