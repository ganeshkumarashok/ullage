name: release

# Tagging is the only way an image or a binary gets published. Nothing here
# runs on a branch push, so `main` can never quietly become "latest".
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # A tag is not a promise that the code works; `main` can be tagged from a
  # phone. Publishing runs the same suite CI runs, and nothing ships if it is
  # red, because a broken release is the one artefact that cannot be recalled.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - run: make check
      - run: go test -race ./...

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      # Built here rather than by a release tool so the version stamping is
      # visible and testable. A binary that reports "v0.1.0-dev" in a bug report
      # costs more to debug than this loop costs to maintain.
      - name: build every published binary
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          commit="$(git rev-parse --short HEAD)"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/ullage_${version}_${os}_${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${version} -X main.commit=${commit}" \
              -o "${out}/ullage" ./cmd/ullage
            tar -czf "${out}.tar.gz" -C "$out" ullage
            rm -rf "$out"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      # A release binary that reports the wrong version is worse than no
      # release, because every bug report from it is misattributed.
      - name: the built binary knows its own version
        run: |
          set -euo pipefail
          tar -xzf "dist/ullage_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C /tmp
          got="$(/tmp/ullage version)"
          echo "reported: $got"
          case "$got" in
            *"${GITHUB_REF_NAME}"*) ;;
            *) echo "binary reports '$got', expected to contain ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          /tmp/ullage demo --quiet --exit-zero >/dev/null

      # Krew installs by digest, so the manifest has to be rendered against the
      # artifacts that were actually built. Checking in a manifest with real
      # digests is impossible (they do not exist until this step) and checking
      # in placeholders is worse, because it looks submittable.
      - name: render the krew manifest against the real artifacts
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          out="dist/krew-${version}.yaml"
          cp .krew.yaml "$out"
          python3 - "$out" "$version" <<'PY'
          import re, sys
          path, version = sys.argv[1], sys.argv[2]
          s = open(path).read()
          s = s.replace("{{ .TagName }}", version)
          digests = {}
          for line in open("dist/checksums.txt"):
              digest, name = line.split()
              digests[name.lstrip("*")] = digest
          def sub(m):
              key = m.group(1)                       # e.g. Darwin_amd64
              name = f"ullage_{version}_{key.lower()}.tar.gz"
              if name not in digests:
                  raise SystemExit(f"no artifact {name}; built: {sorted(digests)}")
              return digests[name]
          s, n = re.subn(r"\{\{ \.Sha256([A-Za-z0-9_]+) \}\}", sub, s)
          if n != 4:
              raise SystemExit(f"replaced {n} digests, expected 4")
          if "{{" in s:
              raise SystemExit("manifest still contains an unrendered placeholder")
          open(path, "w").write(s)
          print(s)
          PY

      # The manifest is only useful if the URLs in it are the files being
      # uploaded beside it. This compares the two lists rather than trusting
      # that the naming convention in two files stayed in sync.
      - name: the krew manifest points at artifacts that exist
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          grep -o 'download/[^ ]*\.tar\.gz' "dist/krew-${version}.yaml" \
            | sed 's#.*/##' | sort -u > /tmp/wanted
          (cd dist && ls *.tar.gz | sort -u) > /tmp/built
          if ! diff -u /tmp/built /tmp/wanted; then
            echo "the krew manifest asks for artifacts this release does not publish"
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/krew-*.yaml
          generate_release_notes: true

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/arm64 is here because ullage runs on the control plane, not on the
      # GPU nodes. The GPUs are amd64; the cluster running this CronJob may not
      # be (Graviton on EKS, Ampere on AKS).
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/ganeshkumarashok/ullage:${{ github.ref_name }}
            ghcr.io/ganeshkumarashok/ullage:latest
