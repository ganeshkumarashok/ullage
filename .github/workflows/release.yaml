name: release

# Tagging is the only way an image or a binary gets published. Nothing here
# runs on a branch push, so `main` can never quietly become "latest".
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # Built here rather than by a release tool so the version stamping is
      # visible and testable. A binary that reports "v0.1.0-dev" in a bug report
      # costs more to debug than this loop costs to maintain.
      - name: build every published binary
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          commit="$(git rev-parse --short HEAD)"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/ullage_${version}_${os}_${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${version} -X main.commit=${commit}" \
              -o "${out}/ullage" ./cmd/ullage
            tar -czf "${out}.tar.gz" -C "$out" ullage
            rm -rf "$out"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      # A release binary that reports the wrong version is worse than no
      # release, because every bug report from it is misattributed.
      - name: the built binary knows its own version
        run: |
          set -euo pipefail
          tar -xzf "dist/ullage_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C /tmp
          got="$(/tmp/ullage version)"
          echo "reported: $got"
          case "$got" in
            *"${GITHUB_REF_NAME}"*) ;;
            *) echo "binary reports '$got', expected to contain ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          /tmp/ullage demo --quiet --exit-zero >/dev/null

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/arm64 is here because ullage runs on the control plane, not on the
      # GPU nodes. The GPUs are amd64; the cluster running this CronJob may not
      # be (Graviton on EKS, Ampere on AKS).
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/ullage-project/ullage:${{ github.ref_name }}
            ghcr.io/ullage-project/ullage:latest
