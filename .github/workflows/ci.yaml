name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - run: go vet ./...
      - run: go test -race ./...

      # The demo is the product's front door, so a broken demo is a broken
      # release. This runs the whole scan against the in-process fake cluster
      # over real HTTP with the production clients, which makes it the closest
      # thing to an integration test that needs no GPUs.
      - name: demo runs end to end
        run: go run ./cmd/ullage demo --exit-zero

      # Every duration the README prints must actually parse. `--window 14d` is
      # the documented default and the first thing anyone copies, and it was a
      # hard parse error for the whole of v0.1's development: time.ParseDuration
      # has no `d` unit. No unit test caught it because no unit test types the
      # flag.
      - name: documented durations parse
        run: |
          set -euo pipefail
          for d in 14d 1w 24h 1d12h 90m; do
            go run ./cmd/ullage demo --window "$d" --quiet --exit-zero >/dev/null \
              || { echo "--window $d failed to parse"; exit 1; }
          done
          if go run ./cmd/ullage demo --window bogus --exit-zero >/dev/null 2>&1; then
            echo "--window bogus was accepted; invalid input must be rejected"
            exit 1
          fi

      - name: demo emits a valid contract
        run: |
          go run ./cmd/ullage demo --output json --quiet --exit-zero > result.json
          python3 - <<'PY'
          import json, sys
          r = json.load(open("result.json"))
          assert r["apiVersion"] == "ullage.dev/v0.1", r["apiVersion"]
          s = r["scan"]
          # Analysed plus excluded must equal observed. This is the promise the
          # whole "honest denominators" claim rests on, so it is worth failing
          # a build over.
          excluded = sum(e["accelerators"] for e in r["notAnalyzed"])
          assert s["acceleratorsAnalyzed"] + excluded == s["acceleratorsObserved"], (
              f'{s["acceleratorsAnalyzed"]} + {excluded} != {s["acceleratorsObserved"]}')
          assert r["recommendations"], "the demo must produce findings"
          # A list field that serialises as null breaks every consumer that
          # iterates it, and does so only on clusters healthy enough to have
          # none -- so it never shows up in a demo unless asserted here.
          for k in ("recommendations", "suppressed", "notAnalyzed", "warnings"):
              assert r.get(k) is not None, f"{k} serialised as null, not []"
          print(f'{len(r["recommendations"])} findings, contract ok')
          PY

      # The suppression loop was once broken end to end: `ignore` wrote a file
      # nothing read, and `explain` printed the command with an argument that
      # The examples are the shortest path from "what is this" to "I can see
      # the value", which makes a broken one expensive: it fails for someone
      # who has not yet decided the tool is worth debugging. jq and shellcheck
      # are preinstalled on the GitHub-hosted runners.
      - name: the example scripts run
        run: |
          set -eux
          make build
          for f in examples/*.sh e2e/kind.sh; do bash -n "$f"; done
          shellcheck -S warning examples/*.sh e2e/*.sh
          PAUSE=0 NO_COLOR=1 ./examples/tour.sh > /dev/null
          ./examples/weekly-digest.sh > /dev/null
          # The gate has to be able to both pass and fail; one that can only
          # ever do one of them is not a gate.
          BUDGET_USD=999999 ./examples/ci-gate.sh > /dev/null
          if BUDGET_USD=1 ./examples/ci-gate.sh > /dev/null 2>&1; then
            echo "the gate passed a \$1 budget against \$10k of waste"; exit 1
          fi

      # could never match. Every piece had a passing unit test. Only walking the
      # path a user walks catches that, so CI walks it.
      - name: suppressions round-trip
        run: |
          set -eux
          go build -o /tmp/ullage ./cmd/ullage
          cd "$(mktemp -d)"

          # Take the command the tool itself prints, verbatim.
          cmd=$(/tmp/ullage explain research/jupyter-alice --demo --quiet \
                | grep -o 'ullage ignore [^ ]*')
          id=${cmd##* }
          /tmp/ullage ignore "$id" --reason "ci round-trip"

          /tmp/ullage demo --output json --quiet --exit-zero > after.json
          python3 - <<PY
          import json
          r = json.load(open("after.json"))
          ids = [f["id"] for f in r["recommendations"]]
          assert "$id" not in ids, "the suppression the tool told us to write did nothing"
          assert [f["id"] for f in r["suppressed"]] == ["$id"], r["suppressed"]
          assert not [w for w in r["warnings"] if "matched nothing" in w], r["warnings"]
          print("suppression round-trip ok")
          PY

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ullage:ci

      # Building the image proves it compiles. Running it proves the entrypoint,
      # the distroless base and the non-root UID actually work together, which
      # is the part that breaks and the part nobody notices until a CronJob
      # CrashLoopBackOffs in someone else's cluster.
      - name: the image runs, unprivileged and read-only
        run: |
          docker run --rm --read-only --user 65532:65532 ullage:ci version
          docker run --rm --read-only --user 65532:65532 ullage:ci demo --quiet --exit-zero --output json \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["recommendations"], "no findings"; print("image ok:", len(r["recommendations"]), "findings")'

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      # go-version: stable rather than a pin, deliberately. Most of what
      # govulncheck finds for a project with one dependency is the Go standard
      # library, and the fix for those is always "build with a newer patch
      # release". Pinning the toolchain here would mean the job reports
      # vulnerabilities it is structurally unable to clear.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
