apiVersion: v1
kind: Namespace
metadata: {name: ml}
---
# Busy: holds gpu 0, exporter reports 78% util. Must NOT be reported.
apiVersion: v1
kind: Pod
metadata: {name: llama-train-0, namespace: ml}
spec:
  nodeSelector: {kubernetes.io/hostname: aks-nodepool1-21098950-vmss000000}
  containers:
  - name: trainer
    image: registry.k8s.io/pause:3.10
    resources: {limits: {nvidia.com/gpu: 1}}
---
# Idle: holds gpu 1, exporter reports 0 util throughout. MUST be reported.
apiVersion: v1
kind: Pod
metadata: {name: idle-notebook-0, namespace: ml}
spec:
  nodeSelector: {kubernetes.io/hostname: aks-nodepool1-21098950-vmss000000}
  containers:
  - name: notebook
    image: registry.k8s.io/pause:3.10
    resources: {limits: {nvidia.com/gpu: 1}}
