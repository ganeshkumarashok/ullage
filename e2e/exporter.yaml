apiVersion: v1
kind: ConfigMap
metadata: {name: dcgm-metrics, namespace: ullage-e2e}
data:
  metrics.py: |
    import http.server, os
    HOST = os.environ["NODE_NAME"]
    # Two GPUs per node. gpu 0 is busy, gpu 1 has read zero all along.
    BODY = []
    def emit(name, val, gpu, pod, ns, model="NVIDIA-A100-SXM4-80GB"):
        BODY.append(
            '%s{gpu="%s",UUID="GPU-%s-%s",modelName="%s",Hostname="%s",pod="%s",namespace="%s"} %s'
            % (name, gpu, HOST, gpu, model, HOST, pod, ns, val))
    # Node 0 holds the real pods; node 1 has nothing scheduled on it and both
    # of its GPUs read zero, which is the unused-node case.
    SPEC = (os.environ["SPEC"] if HOST == os.environ["NODE0"] else os.environ["SPEC_IDLE"]).split(",")
    for item in SPEC:
        gpu, util, power, pod, ns = item.split(":")
        emit("DCGM_FI_DEV_GPU_UTIL", util, gpu, pod, ns)
        emit("DCGM_FI_DEV_POWER_USAGE", power, gpu, pod, ns)
    PAGE = ("\n".join(BODY) + "\n").encode()
    class H(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.end_headers(); self.wfile.write(PAGE)
        def log_message(self, *a): pass
    http.server.HTTPServer(("", 9400), H).serve_forever()
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: dcgm-exporter, namespace: ullage-e2e}
spec:
  selector: {matchLabels: {app: dcgm-exporter}}
  template:
    metadata:
      labels: {app: dcgm-exporter}
    spec:
      containers:
      - name: exporter
        image: python:3.12-alpine
        command: ["python3", "/etc/m/metrics.py"]
        ports: [{containerPort: 9400, name: metrics}]
        env:
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        # gpu:util:power:pod:namespace
        - name: NODE0
          value: "__NODE0__"
        - name: SPEC
          value: "0:78:310:llama-train-0:ml,1:0:41:idle-notebook-0:ml"
        - name: SPEC_IDLE
          value: "0:0:38::,1:0:37::"
        volumeMounts: [{name: m, mountPath: /etc/m}]
      volumes: [{name: m, configMap: {name: dcgm-metrics}}]
