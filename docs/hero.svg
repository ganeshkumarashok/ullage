    <text class="mono" x="58" y="150" font-size="13.5" font-weight="600" fill="#e6edf3">node-a</text>
    <text class="mono" x="382" y="150" font-size="11" fill="#8b949e" text-anchor="end">pool/research</text>

    <rect x="56" y="172" width="76" height="92" rx="6" fill="#0d1117" stroke="#30363d"/>
    <line x1="64" y1="240" x2="124" y2="240" stroke="#21262d"/>
    <text class="mono" x="65" y="190" font-size="10" fill="#8b949e">gpu0</text>
    <g class="spark">
      <polyline transform="translate(64,202)" fill="none" stroke="#3fb950" stroke-width="1.6"
                points="0,30 7,8 14,22 21,5 28,18 35,3 42,25 49,10 56,20 60,12"/>
      <text class="mono" x="65" y="258" font-size="10" fill="#3fb950">busy</text>
    </g>

    <rect x="140" y="172" width="76" height="92" rx="6" fill="#0d1117" stroke="#30363d"/>
