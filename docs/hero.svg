    </g>
    <rect class="fallow" x="436" y="172" width="76" height="92" rx="6" fill="none" stroke="#d29922" stroke-width="1.6"/>

    <rect x="520" y="172" width="76" height="92" rx="6" fill="#0d1117" stroke="#30363d"/>
    <line x1="528" y1="240" x2="588" y2="240" stroke="#21262d"/>
    <text class="mono" x="529" y="190" font-size="10" fill="#8b949e">gpu1</text>
    <g class="spark">
      <polyline transform="translate(528,202)" fill="none" stroke="#d29922" stroke-width="1.6" points="0,38 60,38"/>
      <text class="mono" x="529" y="258" font-size="10" fill="#d29922">idle 14d</text>
    </g>
    <rect class="fallow" x="520" y="172" width="76" height="92" rx="6" fill="none" stroke="#d29922" stroke-width="1.6"/>

    <rect x="604" y="172" width="76" height="92" rx="6" fill="#0d1117" stroke="#30363d"/>
    <line x1="612" y1="240" x2="672" y2="240" stroke="#21262d"/>
    <text class="mono" x="613" y="190" font-size="10" fill="#8b949e">gpu2</text>
    <g class="spark">
      <polyline transform="translate(612,202)" fill="none" stroke="#d29922" stroke-width="1.6" points="0,38 60,38"/>
