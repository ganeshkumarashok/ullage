    <text class="mono" x="762" y="150" font-size="11" fill="#8b949e" text-anchor="end">pool/l4-serving</text>

    <rect x="436" y="172" width="76" height="92" rx="6" fill="#0d1117" stroke="#30363d"/>
    <line x1="444" y1="240" x2="504" y2="240" stroke="#21262d"/>
    <text class="mono" x="445" y="190" font-size="10" fill="#8b949e">gpu0</text>
    <g class="spark">
