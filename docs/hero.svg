    </g>
    <rect class="fallow" x="604" y="172" width="76" height="92" rx="6" fill="none" stroke="#d29922" stroke-width="1.6"/>

    <rect x="688" y="172" width="76" height="92" rx="6" fill="#0d1117" stroke="#30363d"/>
    <line x1="696" y1="240" x2="756" y2="240" stroke="#21262d"/>
    <text class="mono" x="697" y="190" font-size="10" fill="#8b949e">gpu3</text>
    <g class="spark">
      <polyline transform="translate(696,202)" fill="none" stroke="#d29922" stroke-width="1.6" points="0,38 60,38"/>
      <text class="mono" x="697" y="258" font-size="10" fill="#d29922">idle 14d</text>
    </g>
    <rect class="fallow" x="688" y="172" width="76" height="92" rx="6" fill="none" stroke="#d29922" stroke-width="1.6"/>

    <text class="mono fallow" x="438" y="298" font-size="12" fill="#d29922">whole node idle · 2 pods block scale-down</text>
  </g>

