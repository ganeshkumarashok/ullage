    <text class="mono" x="149" y="190" font-size="10" fill="#8b949e">gpu1</text>
    <g class="spark">
      <polyline transform="translate(148,202)" fill="none" stroke="#d29922" stroke-width="1.6" points="0,38 60,38"/>
      <text class="mono" x="149" y="258" font-size="10" fill="#d29922">idle 14d</text>
    </g>
    <rect class="fallow" x="140" y="172" width="76" height="92" rx="6" fill="none" stroke="#d29922" stroke-width="1.6"/>

    <rect x="224" y="172" width="76" height="92" rx="6" fill="#0d1117" stroke="#30363d"/>
    <line x1="232" y1="240" x2="292" y2="240" stroke="#21262d"/>
    <text class="mono" x="233" y="190" font-size="10" fill="#8b949e">gpu2</text>
    <g class="spark">
      <polyline transform="translate(232,202)" fill="none" stroke="#d29922" stroke-width="1.6" points="0,38 60,38"/>
      <text class="mono" x="233" y="258" font-size="10" fill="#d29922">idle 14d</text>
    </g>
    <rect class="fallow" x="224" y="172" width="76" height="92" rx="6" fill="none" stroke="#d29922" stroke-width="1.6"/>

    <rect x="308" y="172" width="76" height="92" rx="6" fill="#0d1117" stroke="#30363d"/>
    <line x1="316" y1="240" x2="376" y2="240" stroke="#21262d"/>
    <text class="mono" x="317" y="190" font-size="10" fill="#8b949e">gpu3</text>
    <g class="spark">
      <polyline transform="translate(316,202)" fill="none" stroke="#d29922" stroke-width="1.6" points="0,38 60,38"/>
      <text class="mono" x="317" y="258" font-size="10" fill="#d29922">idle 14d</text>
    </g>
    <rect class="fallow" x="308" y="172" width="76" height="92" rx="6" fill="none" stroke="#d29922" stroke-width="1.6"/>

    <text class="mono fallow" x="58" y="298" font-size="12" fill="#d29922">3 fallow · jupyter-alice · ~$3,427</text>
  </g>

