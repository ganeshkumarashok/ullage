    <text class="mono reserved" x="818" y="298" font-size="12" fill="#58a6ff">held at a 2-node minimum — not waste</text>
  </g>

  <rect class="sweep" x="20" y="112" width="90" height="216" fill="url(#sweepGrad)"/>

  <!-- ============================== the answer ============================== -->
  <rect class="panel" x="40" y="356" width="1120" height="152" rx="10" fill="#161b22" stroke="#30363d"/>

  <g class="cmd">
    <text class="mono" x="66" y="396" font-size="13.5" fill="#79c0ff">$ ullage scan --window 14d</text>
    <text class="mono" x="66" y="424" font-size="12" fill="#8b949e">reading utilization for 68 accelerators · no writes, no agent, no admission webhook</text>
  </g>

  <g class="verdict">
    <text class="sans" x="66" y="394" font-size="17" font-weight="600" fill="#e6edf3">5.9k of 23k accelerator-hours fallow (26%) · 60 of 68 accelerators analysed</text>

    <text class="mono" x="66" y="424" font-size="12.5" fill="#8b949e">1. research/jupyter-alice · 3 accelerators · 1.0k fallow · ~$3,427 · alice@example.com</text>
    <text class="mono" x="66" y="452" font-size="13" fill="#79c0ff">$ kubectl scale statefulset -n research jupyter-alice --replicas=0</text>
    <text class="mono" x="66" y="478" font-size="11.5" fill="#6e7681">the StatefulSet, not the pods — deleting those frees nothing, the controller recreates them</text>

    <text class="mono" x="1134" y="394" font-size="12" fill="#58a6ff" text-anchor="end">16 more fallow by design</text>
    <text class="mono" x="1134" y="414" font-size="11" fill="#6e7681" text-anchor="end">shown, never counted as waste</text>
  </g>

  <text class="sans" x="48" y="538" font-size="11.5" fill="#6e7681">ullage never writes to your cluster · the census always reconciles: analysed + excluded = observed</text>
</svg>
