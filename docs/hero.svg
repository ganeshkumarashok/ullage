    <text class="mono" x="1142" y="150" font-size="11" fill="#8b949e" text-anchor="end">pool/h100-reserve</text>

    <rect x="816" y="172" width="76" height="92" rx="6" fill="#0d1117" stroke="#30363d"/>
    <line x1="824" y1="240" x2="884" y2="240" stroke="#21262d"/>
    <text class="mono" x="825" y="190" font-size="10" fill="#8b949e">gpu0</text>
    <g class="spark">
      <polyline transform="translate(824,202)" fill="none" stroke="#58a6ff" stroke-width="1.6" points="0,38 60,38"/>
      <text class="mono" x="825" y="258" font-size="10" fill="#58a6ff">reserved</text>
    </g>
    <rect class="reserved" x="816" y="172" width="76" height="92" rx="6" fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-dasharray="4 3"/>

    <rect x="900" y="172" width="76" height="92" rx="6" fill="#0d1117" stroke="#30363d"/>
    <line x1="908" y1="240" x2="968" y2="240" stroke="#21262d"/>
    <text class="mono" x="909" y="190" font-size="10" fill="#8b949e">gpu1</text>
    <g class="spark">
      <polyline transform="translate(908,202)" fill="none" stroke="#58a6ff" stroke-width="1.6" points="0,38 60,38"/>
      <text class="mono" x="909" y="258" font-size="10" fill="#58a6ff">reserved</text>
    </g>
    <rect class="reserved" x="900" y="172" width="76" height="92" rx="6" fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-dasharray="4 3"/>

