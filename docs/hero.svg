<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">What ullage finds</title>
  <desc id="heroDesc">Three nodes from a GPU cluster. Every accelerator on them is
  allocated, so the scheduler reports them as full and every dashboard is green.
  ullage reads fourteen days of utilization for each one and finds that eleven did
  no work at all — but four of those are held open deliberately by an autoscaler
  minimum, so they are shown and never counted as waste. Cluster-wide the result is
  5.9 thousand of 23 thousand accelerator-hours fallow, or 26 percent, with the
  largest single finding an idle Jupyter StatefulSet costing about $3,427.</desc>

  <style>
    /* One 18s timeline shared by every element, so the acts cannot drift apart.
       Percentages carry the sequence, and opacity does nearly all the work,
       because opacity is the one property that behaves identically in every
       renderer that will ever open this file. */
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

    .node     { animation: nodeIn     18s infinite both; }
    .cap1     { animation: cap1       18s infinite both; }
    .cap2     { animation: cap2       18s infinite both; }
    .cap3     { animation: cap3       18s infinite both; }
    .sweep    { animation: sweepFade  18s infinite both, sweepMove 18s infinite both; }
    .spark    { animation: sparkIn    18s infinite both; }
    .fallow   { animation: fallowIn   18s infinite both; }
    .reserved { animation: reservedIn 18s infinite both; }
    .panel    { animation: panelIn    18s infinite both; }
    .cmd      { animation: cmdIn      18s infinite both; }
    .verdict  { animation: verdictIn  18s infinite both; }

    @keyframes nodeIn     { 0%{opacity:0}    4%{opacity:1}  97%{opacity:1} 100%{opacity:0} }
    @keyframes cap1       { 0%,3%{opacity:0}  7%{opacity:1} 22%{opacity:1}  26%{opacity:0} 100%{opacity:0} }
    @keyframes sweepFade  { 0%,24%{opacity:0} 26%{opacity:1} 36%{opacity:1} 38%{opacity:0} 100%{opacity:0} }
    @keyframes sweepMove  { 0%,24%{transform:translateX(0)} 38%,100%{transform:translateX(1080px)} }
    @keyframes cap2       { 0%,25%{opacity:0} 29%{opacity:1} 42%{opacity:1} 46%{opacity:0} 100%{opacity:0} }
    @keyframes sparkIn    { 0%,33%{opacity:0} 38%{opacity:1} 97%{opacity:1} 100%{opacity:0} }
    @keyframes fallowIn   { 0%,42%{opacity:0} 47%{opacity:1} 97%{opacity:1} 100%{opacity:0} }
    @keyframes cap3       { 0%,46%{opacity:0} 50%{opacity:1} 97%{opacity:1} 100%{opacity:0} }
    @keyframes reservedIn { 0%,56%{opacity:0} 61%{opacity:1} 97%{opacity:1} 100%{opacity:0} }
    @keyframes panelIn    { 0%,22%{opacity:0} 26%{opacity:1} 97%{opacity:1} 100%{opacity:0} }
    @keyframes cmdIn      { 0%,26%{opacity:0} 30%{opacity:1} 66%{opacity:1} 70%{opacity:0} 100%{opacity:0} }
    @keyframes verdictIn  { 0%,70%{opacity:0} 75%{opacity:1} 97%{opacity:1} 100%{opacity:0} }

    /* Anyone who has told their system not to animate things gets the last
       frame rather than an empty box, because the last frame is the argument. */
    @media (prefers-reduced-motion: reduce) {
      .node, .spark, .fallow, .reserved, .panel, .verdict, .cap3 { animation: none; opacity: 1; }
      .cap1, .cap2, .sweep, .cmd { display: none; }
    }
  </style>

  <defs>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#d29922" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d29922" stop-opacity="0.28"/>
      <stop offset="1"   stop-color="#d29922" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="560" rx="14" fill="#0d1117"/>

  <text class="sans" x="48" y="54" font-size="19" font-weight="600" fill="#e6edf3">prod-westus3</text>
  <text class="mono" x="1152" y="54" font-size="12.5" fill="#8b949e" text-anchor="end">68 accelerators · 14d window · three nodes shown</text>

  <g class="sans" font-size="15">
    <text class="cap1" x="48" y="92" fill="#8b949e">Every accelerator here is allocated. The scheduler is satisfied and every dashboard is green.</text>
    <text class="cap2" x="48" y="92" fill="#8b949e">ullage reads fourteen days of utilization for each one.</text>
    <text class="cap3" x="48" y="92" fill="#e6edf3">Eleven did no work at all — but four of those are held open <tspan fill="#58a6ff" font-weight="600">on purpose</tspan>.</text>
  </g>

