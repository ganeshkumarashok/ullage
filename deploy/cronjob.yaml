# A weekly scan that writes its result to stdout as JSON.
#
# Weekly, not hourly, and this is deliberate. ullage measures a two-week window
# and reports capacity that has been fallow for days; running it every hour
# produces the same findings sixty times over and trains everyone to ignore it.
# The failure mode of this category of tool is not missing a finding, it is
# becoming background noise.
#
# Apply deploy/rbac.yaml first.
#
# NOTE ON READING THE OUTPUT. This writes JSON to the pod's stdout, which means
# that unless you collect container logs, nobody will ever see it -- and both
# success and failure will be equally silent. Before relying on this, pick one:
#
#   * scrape the logs (Fluent Bit, Vector, Loki, or your cloud's log agent) and
#     alert on `.recommendations | length > 0`;
#   * add a sidecar or a wrapper that POSTs the JSON to Slack, a webhook, or an
#     object store; or
#   * run it from CI instead, where somebody is already looking.
#
# A scheduled job whose output nobody reads is worse than no job at all: it
# creates the belief that the question is being asked.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ullage
  namespace: ullage
spec:
  schedule: "0 8 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 4
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: ullage
          restartPolicy: Never
          # A scan that hangs on an unreachable Prometheus would otherwise sit
          # there until the next schedule, holding concurrencyPolicy: Forbid
          # against its own successor, and the symptom would be silence.
          activeDeadlineSeconds: 3600
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ullage
              image: ghcr.io/ullage-project/ullage:v0.1.0
              args:
                - scan
                - --output=json
                # A finding is not a failure. Exit code 1 on findings is useful
                # in CI, where you asked a question and want an answer; in a
                # CronJob it turns every successful scan that found something
                # into a Job failure and a pager-adjacent alert. If you want
                # the exit code, remove this and set backoffLimit: 0.
                - --exit-zero
              env:
                - name: ULLAGE_PROMETHEUS
                  value: http://prometheus-operated.monitoring.svc:9090
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
